name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # TODO once these modules exist, wire them in as hard gates per
      # saqi-github-publish: OpenAPI-generated client typecheck (fails the
      # build on a breaking API change), widget <40KB bundle budget,
      # route-level performance budgets, bot regression fixtures.
